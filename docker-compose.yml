services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insights}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local}
      POSTGRES_DB: ${POSTGRES_DB:-insights}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - insights_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insights} -d ${POSTGRES_DB:-insights}"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-insights}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local}
      DB_NAME: ${POSTGRES_DB:-insights}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET en .env}
      OMC_EMAIL_DOMAIN: ${OMC_EMAIL_DOMAIN:-omc}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  insights_pgdata:
  frontend_node_modules:
