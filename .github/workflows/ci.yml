name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Comprobar que todo el código compila
        run: python -m compileall -q app core alembic
      - name: Ejecutar pruebas
        env:
          JWT_SECRET: ci-secreto-solo-para-pruebas-0123456789abcdef
          OMC_EMAIL_DOMAIN: omc
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    name: Frontend (compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar tipos y compilar
        run: npm run build
